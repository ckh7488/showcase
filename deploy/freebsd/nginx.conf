# Standalone config for a dedicated report jail. Existing Nginx: copy the server block.
worker_processes auto;
pid /var/run/nginx.pid;
events { worker_connections 1024; }
http {
    include /usr/local/etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server {
        listen 8080;
        server_name _;
        root /usr/local/www/showcase/current;
        index index.html;
        autoindex off;
        # Revalidate same-name report assets after a release change.
        add_header Cache-Control "no-cache" always;
        etag off;
        if_modified_since off;
        open_file_cache off;
        location / { try_files $uri $uri/ =404; }
        location ~ /\. { deny all; }
    }
}
